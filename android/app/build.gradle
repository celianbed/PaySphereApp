plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Paramètres du magasin de clés de signature.
//
// android/key.properties n'est pas versionné : il est créé localement à partir
// de key.properties.example, et régénéré par l'intégration continue à partir
// des secrets du dépôt. Sans lui, seules les compilations de débogage sont
// possibles ; une compilation `release` échoue explicitement plutôt que de
// produire un binaire signé avec la clé de débogage, qu'aucun magasin
// d'applications n'accepte.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreConfigured = keystorePropertiesFile.exists()
if (keystoreConfigured) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "fr.paysphere.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Identifiant définitif de l'application, distinct du `com.example`
        // du gabarit Flutter : un identifiant `com.example.*` est refusé au
        // dépôt sur le Play Store.
        applicationId = "fr.paysphere.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystoreConfigured) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystoreConfigured ? signingConfigs.release : null

            // R8 volontairement désactivé : le code Dart est déjà compilé en
            // AOT, le gain porterait seulement sur la couche Java/Kotlin, et
            // l'activer sans campagne de test sur appareil expose à des
            // régressions par réflexion dans les greffons. À réévaluer une
            // fois les tests d'intégration en place.
            minifyEnabled = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
}
