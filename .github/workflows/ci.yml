name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.8'

jobs:
  qualite:
    name: Analyse statique et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `.env` est déclaré comme asset dans pubspec.yaml mais n'est pas
      # versionné : sans cette étape, `flutter test` et `flutter build`
      # échouent sur un asset manquant.
      - name: Génération du fichier .env
        run: |
          cat > .env <<EOF
          API_KEY=${{ secrets.API_KEY }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          EOF

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Vérification du formatage
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      # Les avertissements et les erreurs bloquent la chaîne ; les remarques de
      # style (`info`) ne la bloquent pas encore. Il en reste 41, pour
      # l'essentiel des `use_build_context_synchronously` et des API
      # dépréciées : les traiter demande de reprendre les écrans un par un, ce
      # qui doit faire l'objet d'un travail dédié plutôt que d'être bâclé ici.
      # Le jour où le compte tombe à zéro, retirer `--no-fatal-infos`.
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        run: flutter test --coverage

      - name: Publication du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/lcov.info
